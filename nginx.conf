worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # For websocket upgrade header
    map $http_upgrade $connection_upgrade {
        default close;
        "websocket" upgrade;
        "h2c" upgrade;
        "upgrade" upgrade;
    }

    upstream app_backend {
        server 127.0.0.1:8001;
        keepalive 64;
    }

    # Redirect all HTTP to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name demo.ftdj.io;  # change to your domain
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http;
        listen [::]:443 ssl http;
        server_name demo.ftdj.io;  # change to your domain

        # TLS certificates (Let's Encrypt paths shown; update to match your certs)
        ssl_certificate /etc/letsencrypt/live/demo.ftdj.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.ftdj.io/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/demo.ftdj.io/chain.pem;

        # Reasonable TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Optional: OCSP stapling (recommended for public sites)
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        resolver_timeout 5s;

        # Optional: HSTS (uncomment after confirming HTTPS works)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_http_version 1.1;

            # Preserve client details
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSockets support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Tunables
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_pass http://app_backend;
        }
    }
}
